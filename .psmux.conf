# ============================================
# ~/.psmux.conf
# ============================================
# Transcription of .tmux.conf for psmux tool

# ============================================
# General Settings
# ============================================
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g history-limit 10000
set -sg escape-time 10
set -g default-terminal "screen-256color"
setw -g mode-keys vi

# ============================================
# Vim-style copy mode
# ============================================

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'clip.exe'

# ============================================
# Rose Pine Status Line (Minimal)
# ============================================

# Reference Values
# ---
# rose_pine_base="#191724"
# rose_pine_surface="#1f1d2e"
# rose_pine_text="#e0def4"
# rose_pine_subtle="#908caa"
# rose_pine_iris="#c4a7e7"

# Rose Piné inspired status line
set -g status-style "bg=#1f1d2e,fg=#c4a7e7"
set -g window-status-style "fg=#908caa"
set -g window-status-current-style "fg=#c4a7e7 bold"
set-option -g pane-active-border-style "fg=#c4a7e7"

set -g status-left "#[fg=#c4a7e7,bold]#S  "
set -g status-right "#[fg=#908caa]%H:%M"

# Rose Piné inspired message bar
# set -g message-style "bg=#191724,fg=#c4a7e7"
# set -g message-command-style "bg=#191724,fg=#c4a7e7"

# Session chooser (Ctrl-b + s) - the key one!
set -g mode-style "bg=#191724,fg=#c4a7e7"
