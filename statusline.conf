# ============================================
# Rose Pine Status Line (Minimal)
# ============================================

rose_pine_base="#191724"
rose_pine_surface="#1f1d2e"
rose_pine_text="#e0def4"
rose_pine_subtle="#908caa"
rose_pine_iris="#c4a7e7"

# Rose Piné inspired status line
set-option -g status-style "fg=$rose_pine_text bg=$rose_pine_surface"
setw -g window-status-style "fg=$rose_pine_subtle"
setw -g window-status-current-style "fg=$rose_pine_iris bold"
set-option -g pane-active-border-style "fg=$rose_pine_iris"

set -g status-left "#[fg=$rose_pine_iris,bold]#S  "
set -g status-right "#[fg=$rose_pine_subtle]%H:%M"

# Rose Piné inspired message bar
set -g message-style bg='#c4a7e7',fg='#191724'        # iris bg, base text
set -g message-command-style bg='#c4a7e7',fg='#191724'
